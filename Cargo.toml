[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/doc",
    "crates/sync",
    "crates/harness",
    "crates/engine",
    "crates/rpc",
    "crates/update",
    "crates/ui",
    "apps/jolt",
]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
jolt-proto = { path = "crates/proto" }
jolt-doc = { path = "crates/doc" }
jolt-sync = { path = "crates/sync" }
jolt-harness = { path = "crates/harness" }
jolt-engine = { path = "crates/engine" }
jolt-rpc = { path = "crates/rpc" }
jolt-update = { path = "crates/update" }
jolt-ui = { path = "crates/ui" }

# CRDT
loro = "1.13"
# Wire protocol for the SessionRoom DO rooms — official Rust twin of the npm
# `loro-protocol` package the TS edge speaks (same monorepo, byte-identical
# frames, cross-checked by its js_snapshots tests).
loro-protocol = "0.3"

# gpui — the wingleeio/zed fork: upstream f14fea9 plus project-specific commits
# at the pinned revision. a6bf17c fixes BOTH wrap-rule copies (LineWrapper +
# line_layout's shaped-text duplicate); 14baea0 adds the EdgeFade primitive
# (Window::with_edge_fade — per-primitive scroll-edge fades for the glass
# sidebar); a6c1ad5 adds BackdropBlur + horizontal EdgeFade + glass fixes;
# 9b672fa bounds renderer GPU memory (region-sized backdrop blur scratch,
# idle release of blur/path intermediates, instance pool shrink,
# JOLT_GPU_STATS=1 diagnostics); b687328 adds ImageSource::evict (frees
# sprite-atlas tiles — remove_asset alone leaked them, see
# attachments::flush_evicted); ac135eb adds device memory to the stats line.
gpui = { git = "https://github.com/wingleeio/zed", rev = "ac135eb227c0784e4bb8f09ae3c3ff6bffd8a827" }
gpui_platform = { git = "https://github.com/wingleeio/zed", rev = "ac135eb227c0784e4bb8f09ae3c3ff6bffd8a827", features = [
    "wayland",
    "x11",
    "font-kit",
    "runtime_shaders",
] }
gpui_tokio = { git = "https://github.com/wingleeio/zed", rev = "ac135eb227c0784e4bb8f09ae3c3ff6bffd8a827" }

# async / net
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
rmcp = { version = "3.1", default-features = false, features = ["server", "transport-streamable-http-server"] }
libc = "0.2"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
futures = "0.3"
async-trait = "0.1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# storage
rusqlite = { version = "0.40", features = ["bundled"] }

# misc
# Global allocator for the binaries: returns freed pages to the OS. System
# malloc (macOS libmalloc especially) retains the churn high-water mark as
# permanent RSS; see docs/architecture.md for the engine storage/runtime model.
mimalloc = "0.1"
anyhow = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
memchr = "2.8"
notify = "8"
portable-pty = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
# Post-0.2.1 master pins Ghostty ab0b9da, which includes the explicit SIMD
# printable-run scan from f2a7652 (the optimization described in
# mitchellh.com/writing/everyone-should-know-simd).
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "72ac98f292879bf9f788fcbb11238c562a1eebe6", default-features = false }
pulldown-cmark = "0.13"
merman = { version = "0.7", features = ["render"] }
ratex-layout = "0.1.14"
ratex-parser = "0.1.14"
ratex-svg = { version = "0.1.14", features = ["embed-fonts"] }
ratex-types = "0.1.14"
unicode-segmentation = "1"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
ignore = "0.4"
keyring = { version = "4.1", default-features = false, features = ["v1"] }

[profile.release]
# Distribution profile (scripts/package-linux.sh): thin LTO buys most of fat
# LTO's size/speed win at a fraction of the link time; strip debug symbols.
lto = "thin"
strip = "symbols"

[profile.dev]
# Keep workspace crates quick to compile while optimizing dependencies: gpui is
# too slow to use unoptimized. Limited debug info and fewer codegen units keep
# incremental development artifacts manageable without sacrificing useful
# backtraces or fast rebuilds.
opt-level = 0
debug = "limited"
codegen-units = 16

[profile.dev.package."*"]
opt-level = 2

# Opt in when a debugging session needs full symbols. Keeping this profile
# non-incremental avoids retaining a second large symbol cache.
[profile.dbg]
inherits = "dev"
debug = "full"
incremental = false
