[package]
name = "jolt-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jolt-doc.workspace = true
loro.workspace = true
loro-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
# tokio-tungstenite 0.30 leaves rustls provider selection to the application.
rustls.workspace = true
futures.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[features]
# In-process registry server speaking the DO's JSON WS protocol — test
# infrastructure for this crate's tests and jolt-engine's integration tests.
mock-server = []

[dev-dependencies]
chrono.workspace = true
jolt-proto.workspace = true
tempfile.workspace = true
# `start_paused` virtual-clock tests (the 2026-07-30 sync-stall regressions).
tokio = { workspace = true, features = ["test-util"] }
