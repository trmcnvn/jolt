name: deploy

# Autodeploy the edge Worker + Durable Objects (session/device rooms, R2,
# WorkOS auth routes) on every push to main that touches edge/. Skips
# gracefully until the CLOUDFLARE_API_TOKEN secret is configured (until then:
# `npm -C edge run deploy` from a wrangler-authenticated machine).
#
# The token needs: Workers Scripts (edit), Workers Routes (edit) on zeron.sh,
# Workers R2 Storage (edit). Account id is pinned in edge/wrangler.jsonc.

on:
  push:
    branches: [main]
    paths:
      - edge/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  edge:
    runs-on: ubuntu-latest
    env:
      # `secrets` is not a valid context in step `if:` expressions — surface
      # the token through job env and gate on that instead.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - name: install
        working-directory: edge
        run: npm ci
      - name: typecheck
        working-directory: edge
        run: npm run typecheck
      - name: test
        working-directory: edge
        run: npm test
      - name: deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: edge
        run: npx wrangler deploy
