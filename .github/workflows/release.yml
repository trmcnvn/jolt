name: release

# Build release artifacts and publish them:
#   - Linux headless tarballs (x86_64 + aarch64) via scripts/package-linux.sh
#   - macOS dmg (Apple silicon) via scripts/package-macos.sh
# then create a GitHub Release AND upload everything to the
# `jolt-releases` R2 bucket (served at jolt.trmcnvn.dev/releases/* for
# `curl -fsSL https://jolt.trmcnvn.dev/install.sh | sh`), bumping latest.txt.
#
# Trigger: push a tag `v<version>` matching the workspace version in
# Cargo.toml (bump it in the same commit), or run manually via
# workflow_dispatch (builds + uploads artifacts, no release/R2 publish).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04 # x86_64
          - runner: ubuntu-24.04-arm # aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: gpui system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Caches written for one tag are unavailable to later tags.
          save-if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
      - name: package
        run: scripts/package-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ runner.arch }}
          path: target/package/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # Heads-up: the macOS cfg paths (Keychain in agent_accounts.rs) have never
  # been type-checked against the Apple SDK — this job may surface errors on
  # its first runs. continue-on-error keeps the Linux release shippable.
  macos:
    runs-on: macos-latest # Apple silicon
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Caches written for one tag are unavailable to later tags.
          save-if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
      - name: build
        run: cargo build --release -p jolt
      - name: import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$certificate"
          chmod 600 "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$certificate"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain"

          identity="$(
            security find-identity -v -p codesigning "$keychain" \
              | awk -F '"' '/Developer ID Application/ { print $2; exit }'
          )"
          test -n "$identity"
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: prepare notarization credentials
        env:
          NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/notary-key.p8"
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$key"
          chmod 600 "$key"
      - name: package dmg
        env:
          SKIP_BUILD: "1"
          NOTARYTOOL_KEY_PATH: ${{ runner.temp }}/notary-key.p8
          NOTARYTOOL_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARYTOOL_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: scripts/package-macos.sh
      - name: remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-key.p8"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ runner.arch }}
          path: |
            target/package/*.dmg
            target/package/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos]
    runs-on: ubuntu-latest
    env:
      # `secrets` is not a valid context in step `if:` expressions — surface
      # the token through job env and gate on that instead.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 2cd5db709b9369660ed7f1d52527c933
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: version guard (tag == artifact version)
        run: |
          ver="${GITHUB_REF_NAME#v}"
          ls dist/
          ls dist/ | grep -q "jolt-$ver-" \
            || { echo "tag v$ver does not match built artifact versions — bump Cargo.toml [workspace.package] version"; exit 1; }
          echo "VERSION=$ver" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
      - name: upload to R2 (jolt.trmcnvn.dev/releases/*)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          for f in dist/*; do
            npx wrangler@4 r2 object put "jolt-releases/$(basename "$f")" \
              --file "$f" --remote
          done
          # manifest.json: version + per-artifact sha256 — the auto-updater
          # (crates/update) verifies downloads against it. Published before
          # latest.txt so no client ever sees a version without its checksums.
          manifest=$(jq -n --arg version "$VERSION" '{version: $version, files: {}}')
          for f in dist/*; do
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            manifest=$(jq --arg name "$(basename "$f")" --arg sha "$sha" \
              '.files[$name] = {sha256: $sha}' <<<"$manifest")
          done
          printf '%s' "$manifest" > manifest.json
          npx wrangler@4 r2 object put jolt-releases/manifest.json \
            --file manifest.json --remote
          printf '%s' "$VERSION" > latest.txt
          npx wrangler@4 r2 object put jolt-releases/latest.txt \
            --file latest.txt --remote
